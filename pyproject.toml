[project]
name = "godot-mcp-server"
version = "0.1.0"
description = "MCP server for Godot Engine integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
godot-mcp-server = "godot_mcp_server:main"
